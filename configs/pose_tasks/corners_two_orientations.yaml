# Harder variant of four_corners: each corner holds two goal modes at the same position,
# rotated ±0.25 rad about z from the corner's original orientation (0.5 rad = 5σ apart
# with sigma = 0.1). The conditioning tokens still only name the corner, so every full
# condition is bimodal in rotation and every one-token condition is 4-modal.
# Same format as four_corners.yaml (see utils/pose_task.py); twists are (vx, vy, vz, wx, wy, wz)
# and the position of a pose is its twist's translation part.
name: corners_two_orientations

start:
  mu: [0, 0, 0, 0, 0, 0]
  sigma: [1, 1, 1, 1, 1, 1]

tokens:
  top:    [0, 0, 1, 0, 0, 0]
  bottom: [0, 0, -1, 0, 0, 0]
  right:  [0, 1, 0, 0, 0, 0]
  left:   [0, -1, 0, 0, 0, 0]

modes:
  - name: top_right_ccw       # 90 deg + 0.25 about z
    tokens: [top, right]
    mu: [5, 5, 5, 0, 0, 1.8208]
    sigma: 0.1
  - name: top_right_cw        # 90 deg - 0.25
    tokens: [top, right]
    mu: [5, 5, 5, 0, 0, 1.3208]
    sigma: 0.1
  - name: bottom_right_ccw    # -90 deg + 0.25
    tokens: [bottom, right]
    mu: [5, 5, -5, 0, 0, -1.3208]
    sigma: 0.1
  - name: bottom_right_cw     # -90 deg - 0.25
    tokens: [bottom, right]
    mu: [5, 5, -5, 0, 0, -1.8208]
    sigma: 0.1
  - name: top_left_ccw        # 180 deg + 0.25
    tokens: [top, left]
    mu: [5, -5, 5, 0, 0, 3.39159]
    sigma: 0.1
  - name: top_left_cw         # 180 deg - 0.25
    tokens: [top, left]
    mu: [5, -5, 5, 0, 0, 2.89159]
    sigma: 0.1
  - name: bottom_left_ccw     # 180 deg + 0.25
    tokens: [bottom, left]
    mu: [5, -5, -5, 0, 0, 3.39159]
    sigma: 0.1
  - name: bottom_left_cw      # 180 deg - 0.25
    tokens: [bottom, left]
    mu: [5, -5, -5, 0, 0, 2.89159]
    sigma: 0.1
