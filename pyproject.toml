[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-matching-transformer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "matplotlib",
    "omegaconf",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*"]
